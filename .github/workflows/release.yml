name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # the npm trusted-publishing exchange
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A tag is not an approval: release only commits that are already on main.
      - name: Require a tagged commit that is on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main
      - name: Require the tag to agree with package.json
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          declared=$(node -p 'require("./package.json").version')
          [ "$tag" = "$declared" ] || { echo "tag $tag disagrees with package.json $declared" >&2; exit 1; }
          echo "value=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      # verify builds dist/ before it tests, and one of those tests asserts the
      # packed tarball actually contains what the exports map resolves to. A
      # published version can never be replaced, so an empty package has to fail
      # here rather than on the registry.
      - run: npm run verify
      - name: Publish to npm via trusted publishing
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          # No npm token exists, here or in the repository's secrets. This step
          # authenticates by exchanging the job's OIDC identity, which the
          # trusted publisher registered on npmjs.org has to match: this
          # repository, and this workflow file by name.
          #
          # Nothing below may put a bearer token in npm's config. npm prefers a
          # token over the exchange, so a leftover one turns a correctly
          # configured publisher into an unexplained 404.
          name=$(node -p 'require("./package.json").name')
          # A published version can never be replaced, so a re-run skips one
          # already on the registry instead of failing the rest of the release.
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION was already published; skipped" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Trusted publishing needs npm 11.5.1+ on Node 22.14+. An older npm
          # does not attempt the exchange at all and publishes anonymously,
          # failing as a 404 that looks like a misconfigured publisher.
          node -e '
            // A prerelease ("11.5.1-rc.0") is older than its own release, and a
            // non-numeric part must not read as 0 and silently pass the floor.
            const parts = v => {
              const core = String(v).replace(/^v/, "").split("-");
              const nums = core[0].split(".").map(Number);
              if (nums.length !== 3 || nums.some(n => !Number.isInteger(n))) return null;
              return core.length > 1 ? [...nums, 0] : [...nums, 1];
            };
            const fail = m => { console.error(m); process.exit(1); };
            const check = (what, actual, floor) => {
              const a = parts(actual);
              if (!a) fail(`cannot read the ${what} version from ${JSON.stringify(actual)}`);
              const f = parts(floor);
              for (let i = 0; i < 4; i += 1) {
                if (a[i] > f[i]) return;
                if (a[i] < f[i]) fail(`trusted publishing needs ${what} ${floor} or newer; this runner has ${actual}`);
              }
            };
            check("npm", process.argv[1], "11.5.1");
            check("Node", process.argv[2], "22.14.0");
          ' "$(npm --version)" "$(node --version)"
          # --provenance is deliberately absent: on this path npm generates and
          # signs provenance from the same identity it authenticated with.
          # --ignore-scripts is absent too, because dist/ is already built above.
          npm publish --access public
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes "Published @jimhoyd/urlcode-ui $GITHUB_REF_NAME from $GITHUB_SHA with npm provenance."
          fi
